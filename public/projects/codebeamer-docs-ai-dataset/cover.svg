    <line x1="120" y1="188" x2="560" y2="188" stroke="#e6e2df" stroke-width="2"/>
    <circle cx="150" cy="164" r="6" fill="#d6d1cc"/>
    <circle cx="172" cy="164" r="6" fill="#d6d1cc"/>
    <circle cx="194" cy="164" r="6" fill="#d6d1cc"/>

    <rect x="160" y="226" width="260" height="22" rx="4" fill="#17161a"/>
    <rect x="160" y="274" width="360" height="10" rx="5" fill="#d6d1cc"/>
    <rect x="160" y="298" width="336" height="10" rx="5" fill="#d6d1cc"/>
