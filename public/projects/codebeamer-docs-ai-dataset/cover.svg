<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title">
  <title id="title">A documentation web page passing through extract, clean and chunk steps into a JSON dataset of chunks</title>
  <rect width="1600" height="840" fill="#f5f3f1"/>

  <!-- Source: an HTML documentation page -->
  <g>
    <rect x="120" y="140" width="440" height="560" rx="14" fill="#ffffff" stroke="#d6d1cc" stroke-width="2"/>
