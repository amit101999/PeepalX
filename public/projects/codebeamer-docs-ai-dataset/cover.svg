    <circle cx="166" cy="461" r="5" fill="#5e5d64"/>
    <rect x="184" y="456" width="270" height="10" rx="5" fill="#d6d1cc"/>

    <rect x="160" y="494" width="180" height="120" rx="6" fill="#f5f3f1" stroke="#d6d1cc" stroke-width="2"/>
    <polyline points="176,596 222,546 252,574 282,536 324,596" fill="none" stroke="#5e5d64" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="300" cy="522" r="10" fill="#d6d1cc"/>

    <rect x="362" y="500" width="158" height="10" rx="5" fill="#a54d27"/>
    <rect x="362" y="530" width="150" height="10" rx="5" fill="#d6d1cc"/>
    <rect x="362" y="554" width="130" height="10" rx="5" fill="#d6d1cc"/>
    <rect x="362" y="578" width="144" height="10" rx="5" fill="#d6d1cc"/>
    <rect x="160" y="646" width="310" height="10" rx="5" fill="#d6d1cc"/>
  </g>

  <!-- The pipeline: one thread from page to dataset -->
  <g font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="24" text-anchor="middle">
    <line x1="560" y1="420" x2="1052" y2="420" stroke="#5e5d64" stroke-width="3"/>
    <path d="M1044 410l16 10-16 10z" fill="#5e5d64"/>

    <rect x="592" y="394" width="124" height="52" rx="26" fill="#ffffff" stroke="#d6d1cc" stroke-width="2"/>
    <text x="654" y="428" fill="#3d3b42">Extract</text>

    <rect x="746" y="394" width="124" height="52" rx="26" fill="#ffffff" stroke="#d6d1cc" stroke-width="2"/>
    <text x="808" y="428" fill="#3d3b42">Clean</text>

    <rect x="900" y="394" width="124" height="52" rx="26" fill="#f6ede8" stroke="#a54d27" stroke-width="2"/>
    <text x="962" y="428" fill="#17161a" font-weight="600">Chunk</text>
  </g>

  <!-- Result: a JSON dataset of structured chunks -->
  <g>
    <rect x="1068" y="140" width="412" height="560" rx="14" fill="#17161a"/>
    <text x="1100" y="200" font-family="Consolas, 'Courier New', monospace" font-size="36" fill="#f6ede8">[</text>
    <text x="1100" y="676" font-family="Consolas, 'Courier New', monospace" font-size="36" fill="#f6ede8">]</text>

    <rect x="1120" y="218" width="320" height="128" rx="10" fill="#26242a" stroke="#a54d27" stroke-width="2"/>
    <rect x="1144" y="242" width="150" height="14" rx="4" fill="#e3a585"/>
    <rect x="1144" y="274" width="260" height="10" rx="5" fill="#5e5d64"/>
    <rect x="1144" y="296" width="228" height="10" rx="5" fill="#5e5d64"/>
    <rect x="1144" y="318" width="190" height="10" rx="5" fill="#5e5d64"/>

    <rect x="1120" y="364" width="320" height="128" rx="10" fill="#26242a" stroke="#5e5d64" stroke-width="2"/>
    <rect x="1144" y="388" width="120" height="14" rx="4" fill="#e3a585"/>
    <rect x="1168" y="420" width="236" height="10" rx="5" fill="#5e5d64"/>
    <rect x="1168" y="442" width="210" height="10" rx="5" fill="#5e5d64"/>
    <rect x="1168" y="464" width="224" height="10" rx="5" fill="#5e5d64"/>

    <rect x="1120" y="510" width="320" height="128" rx="10" fill="#26242a" stroke="#5e5d64" stroke-width="2"/>
    <rect x="1144" y="534" width="170" height="14" rx="4" fill="#e3a585"/>
    <rect x="1144" y="566" width="244" height="10" rx="5" fill="#5e5d64"/>
    <rect x="1144" y="588" width="200" height="10" rx="5" fill="#5e5d64"/>
    <rect x="1144" y="610" width="236" height="10" rx="5" fill="#5e5d64"/>
  </g>

  <g font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#3d3b42" text-anchor="middle">
    <text x="340" y="754">HTML documentation</text>
    <text x="1274" y="754">AI-ready JSON</text>
